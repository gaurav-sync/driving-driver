name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: "Production API URL (https://your-api.onrender.com)"
        required: true

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install root deps
        run: npm ci
        working-directory: .
      - name: Install EAS CLI
        run: npm i -g eas-cli
      - name: Build APK (EAS)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_API_URL: ${{ inputs.api_url }}
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: ${{ secrets.GOOGLE_ANDROID_CLIENT_ID }}
        run: |
          eas build --platform android --profile preview --non-interactive --wait
      - name: Download artifact info
        if: success()
        run: echo "Download APK from the link in the EAS build log above, or expo.dev builds page."